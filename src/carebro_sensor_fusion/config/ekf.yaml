# robot_localization EKF fusing wheel odometry + IMU.
# State order for *_config: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # SAFE DEFAULT: do not publish odom -> base_footprint (the diff-drive controller
    # already does). Output is only the /odometry/filtered topic, so you can compare it
    # with raw odometry and ground truth. To let the EKF own the TF: set
    # enable_odom_tf: false in carebro_controller.yaml AND launch with publish_tf:=true.
    publish_tf: false

    odom0: /carebro_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
